name: CRM correctness experiment

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: ${{ matrix.database_target }} / repetition ${{ matrix.repetition }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - database_target: postgresql-17.11
            repetition: 1
            image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
            expected_version_num: '170011'
            image_source_url: https://hub.docker.com/_/postgres
            expected_vendor: ''
          - database_target: postgresql-17.11
            repetition: 2
            image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
            expected_version_num: '170011'
            image_source_url: https://hub.docker.com/_/postgres
            expected_vendor: ''
          - database_target: percona-postgresql-18
            repetition: 1
            image: percona/percona-distribution-postgresql:18.6.1-3@sha256:cf1ef553805898b73764a19276bf2fc9f78148a0215761ad7491c37c3ed31327
            expected_version_num: '180006'
            image_source_url: https://docs.percona.com/postgresql/18/docker/docker.html
            expected_vendor: Percona
          - database_target: percona-postgresql-18
            repetition: 2
            image: percona/percona-distribution-postgresql:18.6.1-3@sha256:cf1ef553805898b73764a19276bf2fc9f78148a0215761ad7491c37c3ed31327
            expected_version_num: '180006'
            image_source_url: https://docs.percona.com/postgresql/18/docker/docker.html
            expected_vendor: Percona
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: synthetic-ephemeral-only
          POSTGRES_DB: crm_correctness
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixture -d crm_correctness"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://fixture:synthetic-ephemeral-only@127.0.0.1:5432/crm_correctness
      EVIDENCE_DIR: ${{ github.workspace }}/evidence/generated/${{ matrix.database_target }}/repetition-${{ matrix.repetition }}
      DATABASE_TARGET: ${{ matrix.database_target }}
      REPETITION: ${{ matrix.repetition }}
      POSTGRES_IMAGE: ${{ matrix.image }}
      EXPECTED_POSTGRES_VERSION_NUM: ${{ matrix.expected_version_num }}
      IMAGE_SOURCE_URL: ${{ matrix.image_source_url }}
      EXPECTED_IMAGE_VENDOR: ${{ matrix.expected_vendor }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.15'
      - name: Install exact hashed dependencies on cloud runner
        run: |
          mkdir -p "$EVIDENCE_DIR"
          python -m pip install --no-cache-dir --require-hashes --only-binary=:all: -r requirements.lock 2>&1 | tee "$EVIDENCE_DIR/dependency-install.txt"
          python -m pip check 2>&1 | tee "$EVIDENCE_DIR/dependency-check.txt"
      - name: Capture real environment and prove clean database
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: python scripts/capture_environment.py
      - name: Run complete PostgreSQL integration suite
        run: python scripts/run_suite.py
      - name: Preserve PostgreSQL service output
        if: always()
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          mkdir -p "$EVIDENCE_DIR"
          docker logs "$POSTGRES_SERVICE_ID" > "$EVIDENCE_DIR/postgresql-service-output.txt" 2>&1
      - name: Verify evidence and record actual conclusions
        if: always()
        run: python scripts/finalize_evidence.py
      - name: Enforce small artifact upload
        id: size
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['EVIDENCE_DIR'])
          total = sum(p.stat().st_size for p in root.rglob('*') if p.is_file())
          print(f'Actual artifact bytes before upload: {total}')
          assert 0 < total <= 5 * 1024 * 1024, 'Evidence upload exceeds 5 MiB cap or is empty'
          PY
      - name: Upload target-labelled evidence, including failures
        if: always() && steps.size.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crm-evidence-${{ github.run_id }}-attempt-${{ github.run_attempt }}-${{ matrix.database_target }}-repetition-${{ matrix.repetition }}
          path: ${{ env.EVIDENCE_DIR }}
          retention-days: 7
          if-no-files-found: error
          compression-level: 9
